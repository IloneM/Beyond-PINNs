[project]
name = "beyond-pinns"
version = "1.0.0"
description = "Reproducibility code for \"Beyond PINNs: A Unified Gauss-Newton and Petrov-Galerkin Framework for Neural and Hybrid PDE Solvers\" (Schwencke & Maier)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Nilo Schwencke" },
    { name = "Roland Maier" },
]

# Pinned to what actually ran the manuscript's neural/hybrid experiments
# (GPU environment: jax 0.10.2, python-envs/miniconda3x86_64/envs/jax-GPU-py312-x86_64
# on the reference GPU compute node -- see docs/HARDWARE.md). The standalone-FE-only
# work historically used a second, CPU-only environment recorded as jax 0.5.0 /
# numpy 2.1.3 / scipy 1.15.2 / python 3.12.9 in
# petrov_galerkin_results/controlled_timings/machine_metadata.json; either
# environment reproduces the FE reference numbers, only the neural/hybrid
# runs need the GPU-capable jax build.
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.15,<2",
    "jax>=0.10,<0.11",
    "jaxlib>=0.10,<0.11",
    "equinox>=0.13,<0.14",
    "jaxtyping>=0.3,<0.4",
    "matplotlib>=3.9,<4",
    "pyyaml>=6.0,<7",
    # `pinn` (DSGNAR optimizer) is not on PyPI. Pinned to the exact historical
    # commit that ran the manuscript's Part B experiments -- see
    # docs/PROVENANCE.md section 3.1 for why this specific commit is pinned.
    # Required for every Part B benchmark; Part A does not import it.
    "pinn @ git+https://github.com/IloneM/physics-informed-neural-networks.git@8b30ec3961de76ed414dd0f918646dd6358d8fcf",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.10,<0.11"]
plotting = ["matplotlib>=3.9,<4"]
test = ["pytest>=8.0,<9"]

# `ngrad` (github.com/IloneM/Natural-Gradient-PINNs-ICML23) is NOT declared
# as a normal dependency here: it is not on PyPI, and this project only
# needs it for the optional Muller-Zeinhofer reference protocol. See
# docs/PROVENANCE.md and docs/REPRODUCIBILITY.md for the exact pinned-commit
# installation instructions. GaussNewtonDRM and SIREN-Init are likewise
# external/optional -- see docs/PROVENANCE.md.

[project.urls]
Homepage = "https://github.com/IloneM/Beyond-PINNs"
Repository = "https://github.com/IloneM/Beyond-PINNs"
Paper = "https://arxiv.org/abs/2609.20641"
# Dataset DOI for the separate reference-results archive, deposited on
# Zenodo -- not the software's own DOI.
Data = "https://doi.org/10.5281/zenodo.22904196"

[project.scripts]
beyond-pinns = "beyond_pinns.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beyond_pinns"]

# Required by hatchling to accept the pinned `pinn @ git+...` VCS dependency
# above (PEP 508 direct reference) in [project.dependencies].
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
