# MS (multiscale diffusion), HYBRID finite element--neural (projected) --
# the manuscript's selected hybrid method for MS (configs/method_mapping.yaml).
part: general
description: "MS hybrid finite element--neural (projected), h01_green_quadrature (manuscript selection)"

benchmark: MS
model_class: projected_hybrid
family: h01_green_quadrature

architecture: "1D MLP, tanh, [1+3 Fourier features, 32, 32, 1] + FE compensator (P4, 96 elements, 383 DOFs)"
optimizer: DSGNAR (sketched trust-region Gauss-Newton, exact projected Jacobian)
precision: float64
quadrature: "H01-Green split quadrature (operator-adapted test family)"
fe_mesh: "96 uniform elements"
fe_degree: 4
evaluation: "independent error quadrature, rtol=1e-8 atol=1e-10 (CONFIG.global)"
