# not a typo (see configs/method_mapping.yaml).
part: general
description: "JF hybrid finite element--neural (projected), h01_tensor_quadrature (manuscript selection)"

benchmark: JF
model_class: projected_hybrid
family: h01_tensor_quadrature

architecture: "2D MLP, tanh + FE compensator (P4, 12x8 interface-fitted mesh, 1457 DOFs)"
