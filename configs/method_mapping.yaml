# Manuscript's selected pure / hybrid finite-element--neural method mapping
# for the four general weak/hybrid benchmarks (Part B of the paper).
#
# Source of truth: petrov_galerkin_results/controlled_timings/method_mapping.json
# in the historical research tree, produced by a dedicated computational-cost
# / method-mapping audit and cross-checked against the manuscript's reported
# median relative L2/H1 values for each benchmark. This file is a direct,
# lossless YAML transcription -- no values were altered or re-derived.
#
# `family` uses the EXACT internal test-family identifier used throughout the
# research code (CONFIG["section_N"]["pure_petrov"|"projected_hybrid"][family]
# in the Part B driver script, and the `s{N}_{pure,proj}_{family}` result
# directory naming convention). `run` is the exact result-directory name for
# that (benchmark, model) pair under petrov_galerkin_results/section_N/.
#
# median_l2 / median_h1 are the historical 5-seed median final relative L2/H1
# errors recorded at the time of the mapping audit, included here only as a
# traceability cross-check -- NOT to be treated as a substitute for the
# manuscript table (see docs/RESULTS.md for the authoritative traceability
# chain to the actual manuscript numbers).

